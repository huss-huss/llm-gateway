# Example eval suite. Runs fully offline against the fake provider:
#   llm-gateway eval run evals/suite.yaml --model fast
# Point --model at a real alias (with API keys set) to evaluate real models.
name: smoke
description: Basic factual, formatting, and structured-output checks.
defaults:
  temperature: 0
  max_tokens: 200

cases:
  - id: capital-of-france
    prompt: "What is the capital of France? Answer in one sentence."
    assert:
      - { type: contains, value: Paris }
      - { type: not_contains, value: Lyon }

  - id: arithmetic-exact
    prompt: "What is 2 + 2? Reply with only the number."
    assert:
      - { type: exact, value: "4" }

  - id: person-json-schema
    system: "You output only JSON."
    prompt: "Return a JSON object for Ada Lovelace with keys name (string) and born (integer year)."
    response_format: { type: json_object }
    assert:
      - type: json_schema
        schema:
          type: object
          required: [name, born]
          properties:
            name: { type: string }
            born: { type: integer, minimum: 1800, maximum: 1900 }

  - id: year-regex
    prompt: "In JSON, give Ada Lovelace's name and birth year."
    assert:
      - { type: json_valid }
      - { type: regex, pattern: "18[0-9]{2}" }

  - id: judged-capital
    prompt: "Name the capital of France."
    assert:
      - type: llm_judge
        rubric: "The response correctly states that Paris is the capital of France."

  # Expected to FAIL on the fake provider (it does not translate), which shows how
  # failures are reported. A real model should pass it.
  - id: translate-hello
    prompt: "Translate 'hello' into French. Reply with one word."
    assert:
      - { type: contains, value: bonjour }
